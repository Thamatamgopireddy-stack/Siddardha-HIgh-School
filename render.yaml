services:
  - type: web
    name: siddardha-high-school
    env: python
    region: singapore
    plan: free
    buildCommand: "bash Properties/backend/build.sh"
    startCommand: "cd Properties/backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./educore.db
      - key: SECRET_KEY
        generateValue: true
      - key: SCHOOL_NAME
        value: "Siddardha High School"
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.11.0
      - key: NPM_CONFIG_PRODUCTION
        value: "false"

